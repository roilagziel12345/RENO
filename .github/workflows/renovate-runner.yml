name: Renovate Runner

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: "Renovate log level."
        required: false
        default: "info"
        type: choice
        options:
          - info
          - debug
  push:
    branches:
      - main
    paths:
      - "config.js"
      - "renovate/consumers.json"
      - ".github/workflows/renovate-runner.yml"
  schedule:
    - cron: "0 22 * * 0-4"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: renovate-runner
  cancel-in-progress: false

jobs:
  renovate:
    name: Run self-hosted Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate token
        shell: bash
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: test -n "$RENOVATE_TOKEN" || (echo "Missing RENOVATE_TOKEN secret" && exit 1)

      - name: Run Renovate
        uses: docker://renovate/renovate:latest
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_PLATFORM: ${{ vars.RENOVATE_PLATFORM || 'github' }}
          RENOVATE_ENDPOINT: ${{ vars.RENOVATE_ENDPOINT }}
          RENOVATE_REQUIRE_CONFIG: optional
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
